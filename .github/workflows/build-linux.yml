name: Build Linux Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker
        run: podman build -t beatboard-builder:latest -f build/Dockerfile .

      - name: Extract portable
        run: podman run --rm -v $(pwd)/build:/output:Z beatboard-builder:latest cp -r /build/output/BeatBoard-portable /output/

      - name: Prepare AppDir
        run: |
          cd build
          mkdir -p AppDir/usr/bin
          cp ../../dist/BeatBoard AppDir/usr/bin/beatboard
          chmod +x AppDir/usr/bin/beatboard

      - name: Create AppRun
        run: |
          echo '#!/bin/bash' > build/AppDir/AppRun
          echo 'exec "$(dirname "$0")/usr/bin/beatboard" "$@"' >> build/AppDir/AppRun
          chmod +x build/AppDir/AppRun

      - name: Copy icon
        run: cp beatboard/ui/icons/app_icon_256.png build/AppDir/beatboard.png

      - name: Create desktop file
        run: |
          echo '[Desktop Entry]' > build/AppDir/beatboard.desktop
          echo 'Name=BeatBoard' >> build/AppDir/beatboard.desktop
          echo 'Comment=A virtual beat board for screenwriters' >> build/AppDir/beatboard.desktop
          echo 'Exec=AppRun' >> build/AppDir/beatboard.desktop
          echo 'Icon=beatboard' >> build/AppDir/beatboard.desktop
          echo 'Terminal=false' >> build/AppDir/beatboard.desktop
          echo 'Type=Application' >> build/AppDir/beatboard.desktop
          echo 'Categories=Office;TextEditor;' >> build/AppDir/beatboard.desktop

      - name: Download appimagetool
        run: |
          cd build
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Create AppImage
        run: |
          cd build
          ./appimagetool AppDir BeatBoard-Linux-x86_64-QT6_PySide6-v1.0.10.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeatBoard-Linux
          path: |
            build/BeatBoard-Linux-x86_64-QT6_PySide6-v1.0.10.AppImage
            build/output/BeatBoard-portable

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/BeatBoard-Linux-x86_64-QT6_PySide6-v1.0.10.AppImage
            build/output/BeatBoard-portable
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
