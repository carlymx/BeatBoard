name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 Python 3.10
          - os: ubuntu-latest
            spec: beatboard-linux.spec
            artifact: BeatBoard-Linux

          # MS Window 7-11 x86-64
          - os: windows-latest
            spec: beatboard-windows.spec
            artifact: BeatBoard-Windows

          # USAMOS MACOS-14 (Apple Silicon) para compilar AMBOS (Intel y ARM)
          - os: macos-14
            spec: beatboard-macos.spec
            artifact: BeatBoard-MacOS-Universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # --- LÓGICA LINUX/WINDOWS (Se mantiene igual que antes) ---
      # ... (Pasos de Docker para Linux y pip para Windows) ...

      # --- LÓGICA PARA MAC (SOPORTE TOTAL) ---
      - name: Install Dependencies (Mac)
        if: matrix.os == 'macos-14'
        run: |
          # Instalamos PySide 6.5.3 que es el último con soporte garantizado para macOS 11
          pip install pyside6==6.5.3 pyinstaller spylls

      - name: Build with PyInstaller (Mac Universal 2)
        if: matrix.os == 'macos-14'
        env:
          # Esto es CRÍTICO para que funcione en macOS 11.7.10
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          # PyInstaller detectará el 'universal2' del archivo .spec
          pyinstaller ${{ matrix.spec }} --clean --noconfirm

      # --- SUBIDA DE RESULTADOS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/BeatBoard_portable
            dist/BeatBoard.app
