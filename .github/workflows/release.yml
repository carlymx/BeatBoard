name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: BeatBoard-Linux
            path: dist/ # Subiremos toda la carpeta que extraigamos de Docker

          - os: windows-latest
            spec: beatboard-windows.spec
            artifact: BeatBoard-Windows
            path: dist/*.exe # En Windows solo nos interesa el .exe

          - os: macos-14
            spec: beatboard-macos.spec
            artifact: BeatBoard-MacOS-Universal
            path: dist/BeatBoard.app # En Mac subimos el bundle .app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # --- LÓGICA PARA LINUX (DOCKER) ---
      - name: Build Linux (Ubuntu 22.04 Container)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          docker build -t builder -f Dockerfile.ubuntu22 .
          docker run --name extract builder /bin/true
          # Copiamos TODO lo que el Dockerfile dejó en /build/output a nuestro dist local
          docker cp extract:/build/output/. ./dist/
          docker rm extract

      # --- LÓGICA PARA WINDOWS ---
      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: pip install pyside6 pyinstaller spylls

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller ${{ matrix.spec }} --clean --noconfirm

      # --- LÓGICA PARA MAC ---
      - name: Install Dependencies (Mac)
        if: matrix.os == 'macos-14'
        run: pip install pyside6==6.5.3 pyinstaller spylls

      - name: Build with PyInstaller (Mac Universal 2)
        if: matrix.os == 'macos-14'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: pyinstaller ${{ matrix.spec }} --clean --noconfirm

      # --- SUBIDA DE RESULTADOS (CORREGIDA) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error # Esto nos avisará si algo falló realmente en la compilación
